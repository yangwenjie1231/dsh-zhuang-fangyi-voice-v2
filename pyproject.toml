[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zfh-voice"
version = "0.1.0"
description = "庄方宜专属中文音色推理（ONNX / torch 双后端）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "onnxruntime>=1.17",
    "numpy>=1.24",
    "soundfile>=0.12",
    "soxr>=0.3",
    "transformers>=4.30",
    "pypinyin>=0.49",
    "cn2an>=0.5.22",
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
    # 中英混排：让英文用真英文发音念。
    # 不装也能跑，但英文会被中文前端静默删除。
    # 所需数据（cmudict.rep / nltk tagger / lid.176.ftz）都已随包分发，无需联网。
    "nltk>=3.8",
    "g2p-en>=2.1.0",
    "wordsegment>=1.3.0",
    "fast-langdetect>=0.2",
    "split-lang>=0.3",
]

[project.optional-dependencies]
torch = ["torch>=2.7", "torchaudio>=2.7"]
dev = ["pytest"]

[project.scripts]
zfh-voice = "zfh_voice.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zfh_voice" = [
    "_vendor/_gsv_text/*.txt",
    "_vendor/_gsv_text/**/*.py",
    "_vendor/_gsv_text/**/*.txt",
    "_vendor/_gsv_text/**/*.json",
    "_vendor/_gsv_text/**/*.rep",
    "_vendor/_gsv_text/**/*.md5",
    # 中英混排所需的数据（随包分发，避免运行时联网下载）
    #
    # ⚠️ `corpora/cmudict/cmudict` **没有扩展名** —— g2p_en 会
    # `from nltk.corpus import cmudict` 再 `cmudict.dict()`，缺了它英文就废了，
    # 而 nltk 的兜底是 `nltk.download('cmudict')`，在受限网络下会被挡住。
    # 所以这里必须用 `**/*` 而不是只匹配 `*.json`。
    "_vendor/nltk_data/**/*",
]
